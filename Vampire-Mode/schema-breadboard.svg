<svg viewBox="0 0 1000 950" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="950" fill="#fbf9f4"/>
  <text x="500" y="35" text-anchor="middle" font-size="24" font-weight="bold" fill="#2b2b2b">Montage sur Breadboard — Station Météo de Lumière</text>

  <!-- ================= BREADBOARD ================= -->
  <g id="breadboard">
    <rect x="150" y="70" width="700" height="330" rx="12" fill="#eeeeee" stroke="#bbb" stroke-width="2"/>

    <!-- top power rails -->
    <line x1="170" y1="95" x2="830" y2="95" stroke="#e57373" stroke-width="2"/>
    <line x1="170" y1="115" x2="830" y2="115" stroke="#64b5f6" stroke-width="2"/>
    <text x="160" y="99" text-anchor="end" font-size="11" fill="#d32f2f">+</text>
    <text x="160" y="119" text-anchor="end" font-size="11" fill="#1565c0">−</text>

    <!-- top rail holes -->
    <g fill="#999">
      <!-- generate rows of dots -->
      <g id="toprail-plus">
        <!-- 30 dots -->
        <circle cx="180" cy="95" r="2.2"/><circle cx="200" cy="95" r="2.2"/><circle cx="220" cy="95" r="2.2"/><circle cx="240" cy="95" r="2.2"/><circle cx="260" cy="95" r="2.2"/><circle cx="280" cy="95" r="2.2"/><circle cx="300" cy="95" r="2.2"/><circle cx="320" cy="95" r="2.2"/><circle cx="340" cy="95" r="2.2"/><circle cx="360" cy="95" r="2.2"/><circle cx="380" cy="95" r="2.2"/><circle cx="400" cy="95" r="2.2"/><circle cx="420" cy="95" r="2.2"/><circle cx="440" cy="95" r="2.2"/><circle cx="460" cy="95" r="2.2"/><circle cx="480" cy="95" r="2.2"/><circle cx="500" cy="95" r="2.2"/><circle cx="520" cy="95" r="2.2"/><circle cx="540" cy="95" r="2.2"/><circle cx="560" cy="95" r="2.2"/><circle cx="580" cy="95" r="2.2"/><circle cx="600" cy="95" r="2.2"/><circle cx="620" cy="95" r="2.2"/><circle cx="640" cy="95" r="2.2"/><circle cx="660" cy="95" r="2.2"/><circle cx="680" cy="95" r="2.2"/><circle cx="700" cy="95" r="2.2"/><circle cx="720" cy="95" r="2.2"/><circle cx="740" cy="95" r="2.2"/><circle cx="760" cy="95" r="2.2"/><circle cx="780" cy="95" r="2.2"/><circle cx="800" cy="95" r="2.2"/><circle cx="820" cy="95" r="2.2"/>
      </g>
      <g id="toprail-minus">
        <circle cx="180" cy="115" r="2.2"/><circle cx="200" cy="115" r="2.2"/><circle cx="220" cy="115" r="2.2"/><circle cx="240" cy="115" r="2.2"/><circle cx="260" cy="115" r="2.2"/><circle cx="280" cy="115" r="2.2"/><circle cx="300" cy="115" r="2.2"/><circle cx="320" cy="115" r="2.2"/><circle cx="340" cy="115" r="2.2"/><circle cx="360" cy="115" r="2.2"/><circle cx="380" cy="115" r="2.2"/><circle cx="400" cy="115" r="2.2"/><circle cx="420" cy="115" r="2.2"/><circle cx="440" cy="115" r="2.2"/><circle cx="460" cy="115" r="2.2"/><circle cx="480" cy="115" r="2.2"/><circle cx="500" cy="115" r="2.2"/><circle cx="520" cy="115" r="2.2"/><circle cx="540" cy="115" r="2.2"/><circle cx="560" cy="115" r="2.2"/><circle cx="580" cy="115" r="2.2"/><circle cx="600" cy="115" r="2.2"/><circle cx="620" cy="115" r="2.2"/><circle cx="640" cy="115" r="2.2"/><circle cx="660" cy="115" r="2.2"/><circle cx="680" cy="115" r="2.2"/><circle cx="700" cy="115" r="2.2"/><circle cx="720" cy="115" r="2.2"/><circle cx="740" cy="115" r="2.2"/><circle cx="760" cy="115" r="2.2"/><circle cx="780" cy="115" r="2.2"/><circle cx="800" cy="115" r="2.2"/><circle cx="820" cy="115" r="2.2"/>
      </g>
    </g>

    <!-- main grid: 10 rows x many columns, split by center gap -->
    <g fill="#999">
      <!-- rows y=150..300 step 15, columns x=190..810 step 12 (sparse sample for look) -->
      <g id="grid-rows">
        <!-- Row A..E (upper half) -->
        <g>
          <!-- we just draw dot rows at 5 y-levels above gap and 5 below, columns every 20px -->
        </g>
      </g>
    </g>
    <!-- simplified grid using pattern -->
    <g stroke="none" fill="#aaa">
      <g id="upper-grid">
        <!-- rows -->
        <g transform="translate(0,0)">
          <!-- generated rows -->
        </g>
      </g>
    </g>

    <!-- Draw grid programmatically-ish with tspan loops isn't possible in raw svg, so approximate visually with lines representing strips -->
    <g stroke="#ccc" stroke-width="1">
      <line x1="170" y1="150" x2="830" y2="150"/>
      <line x1="170" y1="165" x2="830" y2="165"/>
      <line x1="170" y1="180" x2="830" y2="180"/>
      <line x1="170" y1="195" x2="830" y2="195"/>
      <line x1="170" y1="210" x2="830" y2="210"/>
      <!-- gap -->
      <line x1="170" y1="245" x2="830" y2="245"/>
      <line x1="170" y1="260" x2="830" y2="260"/>
      <line x1="170" y1="275" x2="830" y2="275"/>
      <line x1="170" y1="290" x2="830" y2="290"/>
      <line x1="170" y1="305" x2="830" y2="305"/>
    </g>
    <rect x="170" y="220" width="660" height="18" fill="#ddd"/>
    <text x="500" y="233" text-anchor="middle" font-size="10" fill="#888">canal central</text>

    <!-- bottom power rails -->
    <line x1="170" y1="355" x2="830" y2="355" stroke="#e57373" stroke-width="2"/>
    <line x1="170" y1="375" x2="830" y2="375" stroke="#64b5f6" stroke-width="2"/>
    <text x="160" y="359" text-anchor="end" font-size="11" fill="#d32f2f">+</text>
    <text x="160" y="379" text-anchor="end" font-size="11" fill="#1565c0">−</text>

    <text x="500" y="415" text-anchor="middle" font-size="13" font-style="italic" fill="#777">Breadboard (vue de dessus)</text>
  </g>

  <!-- ================= COMPONENTS ON BREADBOARD ================= -->

  <!-- Potentiometer sitting across the center gap around column 250-280 -->
  <g id="potentiometer" transform="translate(230,170)">
    <rect x="0" y="0" width="60" height="60" rx="6" fill="#f9a825" stroke="#a86e00" stroke-width="2"/>
    <circle cx="30" cy="30" r="14" fill="#fff8e1" stroke="#a86e00" stroke-width="1.5"/>
    <line x1="30" y1="30" x2="42" y2="18" stroke="#a86e00" stroke-width="2"/>
    <text x="30" y="-6" text-anchor="middle" font-size="11" font-weight="bold" fill="#3b2c00">POT</text>
    <!-- 3 legs going down into breadboard rows -->
    <line x1="10" y1="60" x2="10" y2="80" stroke="#333" stroke-width="2"/>
    <line x1="30" y1="60" x2="30" y2="80" stroke="#333" stroke-width="2"/>
    <line x1="50" y1="60" x2="50" y2="80" stroke="#333" stroke-width="2"/>
    <text x="10" y="95" text-anchor="middle" font-size="9">GND</text>
    <text x="30" y="95" text-anchor="middle" font-size="9">VO</text>
    <text x="50" y="95" text-anchor="middle" font-size="9">5V</text>
  </g>

  <!-- LDR photoresistor, placed straddling the center gap around column 400 -->
  <g id="ldr" transform="translate(380,205)">
    <circle cx="20" cy="15" r="18" fill="#fff59d" stroke="#a86e00" stroke-width="2"/>
    <path d="M6,8 L34,22 M6,22 L34,8 M2,15 L38,15" stroke="#7a5a00" stroke-width="1.5" fill="none"/>
    <text x="20" y="-5" text-anchor="middle" font-size="11" font-weight="bold" fill="#5c4300">LDR</text>
    <line x1="8" y1="33" x2="8" y2="45" stroke="#333" stroke-width="2"/>
    <line x1="32" y1="33" x2="32" y2="45" stroke="#333" stroke-width="2"/>
  </g>

  <!-- Resistor 10k, next to LDR, straddling gap -->
  <g id="resistor" transform="translate(440,215)">
    <rect x="0" y="6" width="46" height="14" rx="3" fill="#d7ccc8" stroke="#5d4037" stroke-width="1.5"/>
    <path d="M6,13 L12,7 L18,19 L24,7 L30,19 L36,7 L40,13" stroke="#5d4037" stroke-width="1.5" fill="none"/>
    <text x="23" y="-2" text-anchor="middle" font-size="11" font-weight="bold" fill="#5d4037">R 10kΩ</text>
    <line x1="0" y1="13" x2="-14" y2="13" stroke="#333" stroke-width="2"/>
    <line x1="46" y1="13" x2="60" y2="13" stroke="#333" stroke-width="2"/>
  </g>

  <!-- ================= ARDUINO ================= -->
  <g id="arduino" transform="translate(150,470)">
    <rect x="0" y="0" width="300" height="200" rx="10" fill="#1e88a8" stroke="#12546a" stroke-width="2"/>
    <text x="150" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">ARDUINO UNO</text>
    <rect x="10" y="80" width="40" height="55" fill="#c0c0c0" stroke="#888"/>
    <text x="30" y="112" text-anchor="middle" font-size="9" fill="#333">USB</text>
    <g font-size="12" fill="#fff">
      <text x="70" y="60">5V</text>
      <text x="110" y="60">GND</text>
      <text x="160" y="60">A0</text>
      <text x="70" y="180">D12</text>
      <text x="110" y="180">D11</text>
      <text x="150" y="180">D5</text>
      <text x="190" y="180">D4</text>
      <text x="230" y="180">D3</text>
      <text x="270" y="180">D2</text>
    </g>
    <g fill="#fff">
      <circle cx="75" cy="50" r="3"/>
      <circle cx="118" cy="50" r="3"/>
      <circle cx="165" cy="50" r="3"/>
      <circle cx="75" cy="170" r="3"/>
      <circle cx="118" cy="170" r="3"/>
      <circle cx="155" cy="170" r="3"/>
      <circle cx="195" cy="170" r="3"/>
      <circle cx="235" cy="170" r="3"/>
      <circle cx="275" cy="170" r="3"/>
    </g>
  </g>

  <!-- ================= LCD ================= -->
  <g id="lcd" transform="translate(600,470)">
    <rect x="0" y="0" width="330" height="140" rx="10" fill="#2e7d32" stroke="#1b5e20" stroke-width="2"/>
    <text x="165" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">ÉCRAN LCD 16x2</text>
    <g font-size="11" fill="#fff">
      <text x="20" y="55">VSS</text><text x="60" y="55">VDD</text><text x="100" y="55">VO</text><text x="140" y="55">RS</text><text x="175" y="55">RW</text>
      <text x="210" y="55">E</text><text x="245" y="55">D4</text><text x="280" y="55">D5</text><text x="305" y="70">D6</text>
      <text x="20" y="90">D7</text><text x="60" y="90">A+</text><text x="100" y="90">K-</text>
    </g>
    <g fill="#fff">
      <circle cx="15" cy="45" r="3"/><circle cx="55" cy="45" r="3"/><circle cx="95" cy="45" r="3"/><circle cx="135" cy="45" r="3"/><circle cx="170" cy="45" r="3"/>
      <circle cx="205" cy="45" r="3"/><circle cx="240" cy="45" r="3"/><circle cx="275" cy="45" r="3"/><circle cx="310" cy="45" r="3"/>
      <circle cx="15" cy="80" r="3"/><circle cx="55" cy="80" r="3"/><circle cx="95" cy="80" r="3"/>
    </g>
  </g>

  <!-- ================= WIRES (jumpers) ================= -->
  <!-- Arduino 5V -> breadboard top + rail -->
  <path d="M220,470 L220,430 L180,430 L180,95" fill="none" stroke="#d32f2f" stroke-width="2.5"/>
  <!-- Arduino GND -> breadboard top - rail -->
  <path d="M260,470 L260,440 L200,440 L200,115" fill="none" stroke="#333" stroke-width="2.5"/>
  <!-- Arduino A0 -> LDR/R junction row -->
  <path d="M310,470 L310,450 L420,450 L420,260" fill="none" stroke="#f57f17" stroke-width="2.5"/>

  <!-- Top + rail -> potentiometer 5V leg -->
  <path d="M280,95 L280,260 L280,250" fill="none" stroke="#d32f2f" stroke-width="2"/>
  <!-- Top - rail -> potentiometer GND leg -->
  <path d="M260,115 L260,250" fill="none" stroke="#333" stroke-width="2"/>
  <!-- Top + rail -> LDR top leg -->
  <path d="M388,95 L388,250" fill="none" stroke="#d32f2f" stroke-width="2"/>
  <!-- bottom - rail -> resistor other leg -->
  <path d="M500,260 L500,355" fill="none" stroke="#333" stroke-width="2"/>

  <!-- Potentiometer wiper (VO) -> LCD VO -->
  <path d="M260,250 L260,430 L650,430 L650,470" fill="none" stroke="#1565c0" stroke-width="2.5"/>

  <!-- Arduino digital pins -> LCD -->
  <path d="M220,670 L220,700 L735,700 L735,610" fill="none" stroke="#6a1b9a" stroke-width="2"/>
  <text x="480" y="695" font-size="11" fill="#6a1b9a">RS (D12 → LCD RS)</text>

  <path d="M258,670 L258,715 L810,715 L810,610" fill="none" stroke="#00838f" stroke-width="2"/>
  <text x="480" y="712" font-size="11" fill="#00838f">E (D11 → LCD E)</text>

  <path d="M300,670 L300,730 L845,730 L845,610" fill="none" stroke="#c62828" stroke-width="2"/>
  <text x="480" y="728" font-size="11" fill="#c62828">D4 (D5 → LCD D4)</text>

  <path d="M340,670 L340,745 L875,745 L875,610" fill="none" stroke="#2e7d32" stroke-width="2"/>
  <text x="480" y="742" font-size="11" fill="#2e7d32">D5 (D4 → LCD D5)</text>

  <path d="M380,670 L380,760 L905,760 L905,610" fill="none" stroke="#ef6c00" stroke-width="2"/>
  <text x="480" y="758" font-size="11" fill="#ef6c00">D6 (D3 → LCD D6)</text>

  <path d="M420,670 L420,775 L935,775 L935,610" fill="none" stroke="#4527a0" stroke-width="2"/>
  <text x="480" y="772" font-size="11" fill="#4527a0">D7 (D2 → LCD D7)</text>

  <!-- LCD RW -> GND rail -->
  <path d="M770,610 L770,585 L960,585 L960,115 L200,115" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Legend -->
  <g font-size="12">
    <rect x="150" y="800" width="700" height="130" rx="8" fill="#ffffff" stroke="#ccc"/>
    <text x="500" y="822" text-anchor="middle" font-weight="bold">Légende</text>
    <line x1="170" y1="840" x2="200" y2="840" stroke="#d32f2f" stroke-width="3"/><text x="207" y="844">Alimentation 5V</text>
    <line x1="170" y1="858" x2="200" y2="858" stroke="#333" stroke-width="3"/><text x="207" y="862">Masse (GND)</text>
    <line x1="170" y1="876" x2="200" y2="876" stroke="#f57f17" stroke-width="3"/><text x="207" y="880">Signal capteur (A0)</text>
    <line x1="450" y1="840" x2="480" y2="840" stroke="#1565c0" stroke-width="3"/><text x="487" y="844">Contraste (VO)</text>
    <line x1="450" y1="858" x2="480" y2="858" stroke="#6a1b9a" stroke-width="3"/><text x="487" y="862">Données LCD (RS/E/D4-D7)</text>
    <text x="500" y="895" text-anchor="middle" font-size="11" fill="#888" font-style="italic">Le potentiomètre et la LDR sont placés à cheval sur le canal central de la breadboard.</text>
  </g>
</svg>
