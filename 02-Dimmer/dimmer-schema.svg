<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="500" fill="#fbf9f4"/>
  <text x="450" y="35" text-anchor="middle" font-size="24" font-weight="bold" fill="#2b2b2b">Schéma de câblage — Le Variateur d'Intensité</text>

  <!-- ARDUINO -->
  <rect x="60" y="90" width="220" height="320" rx="10" fill="#1e88a8" stroke="#12546a" stroke-width="2"/>
  <text x="170" y="120" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">ARDUINO UNO</text>

  <g font-size="14" fill="#fff">
    <text x="80" y="180">5V</text>
    <text x="80" y="230">GND</text>
    <text x="80" y="280">A0</text>
    <text x="80" y="350">Pin 9 (PWM ~)</text>
  </g>
  <g fill="#fff">
    <circle cx="275" cy="176" r="4"/>
    <circle cx="275" cy="226" r="4"/>
    <circle cx="275" cy="276" r="4"/>
    <circle cx="275" cy="346" r="4"/>
  </g>

  <!-- POTENTIOMETRE -->
  <g transform="translate(420,150)">
    <rect x="0" y="0" width="160" height="80" rx="8" fill="#f9a825" stroke="#a86e00" stroke-width="2"/>
    <text x="80" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#3b2c00">POTENTIOMÈTRE</text>
    <circle cx="80" cy="55" r="16" fill="#fff8e1" stroke="#a86e00" stroke-width="1.5"/>
    <line x1="80" y1="55" x2="95" y2="42" stroke="#a86e00" stroke-width="2"/>
    <circle cx="0" cy="80" r="4" fill="#3b2c00"/>
    <circle cx="80" cy="0" r="4" fill="#3b2c00"/>
    <circle cx="160" cy="80" r="4" fill="#3b2c00"/>
    <text x="0" y="95" text-anchor="middle" font-size="11" fill="#3b2c00">GND</text>
    <text x="80" y="-8" text-anchor="middle" font-size="11" fill="#3b2c00">A0</text>
    <text x="160" y="95" text-anchor="middle" font-size="11" fill="#3b2c00">5V</text>
  </g>

  <!-- LED + RESISTANCE 220 -->
  <g transform="translate(650,270)">
    <circle cx="40" cy="10" r="24" fill="#fff9c4" stroke="#f9a825" stroke-width="3"/>
    <text x="40" y="16" text-anchor="middle" font-size="16">💡</text>
    <text x="40" y="-14" text-anchor="middle" font-size="13" font-weight="bold" fill="#5c4300">LED</text>
    <text x="10" y="45" font-size="10" fill="#333">+ (longue)</text>
    <text x="45" y="45" font-size="10" fill="#333">- (courte)</text>
    <line x1="15" y1="34" x2="15" y2="60" stroke="#333" stroke-width="2"/>
    <line x1="65" y1="34" x2="65" y2="60" stroke="#333" stroke-width="2"/>

    <rect x="50" y="60" width="14" height="46" rx="3" fill="#d7ccc8" stroke="#5d4037" stroke-width="1.5"/>
    <path d="M57,60 L50,68 L64,78 L50,88 L64,98 L57,106" stroke="#5d4037" stroke-width="1.5" fill="none"/>
    <text x="100" y="88" font-size="11" fill="#5d4037">R 220-330Ω</text>
  </g>

  <!-- CONNECTIONS -->
  <!-- Arduino 5V -> pot right pin -->
  <path d="M275,176 L340,176 L340,230 L580,230" fill="none" stroke="#d32f2f" stroke-width="2.5"/>
  <!-- Arduino GND -> pot left pin -->
  <path d="M275,226 L300,226 L300,300 L420,300 L420,230" fill="none" stroke="#333" stroke-width="2.5"/>
  <!-- Pot center (A0) -> Arduino A0 -->
  <path d="M500,150 L500,130 L360,130 L360,276 L275,276" fill="none" stroke="#f57f17" stroke-width="2.5"/>

  <!-- Arduino Pin9 -> LED anode -->
  <path d="M275,346 L560,346 L560,314 L665,314" fill="none" stroke="#6a1b9a" stroke-width="2.5"/>
  <text x="420" y="340" font-size="11" fill="#6a1b9a">Pin 9 → LED (+)</text>

  <!-- LED cathode via resistor -> GND -->
  <path d="M714,376 L714,410 L330,410 L330,226 L275,226" fill="none" stroke="#333" stroke-width="2.5"/>

  <!-- Legend -->
  <g font-size="12">
    <rect x="60" y="440" width="780" height="40" rx="8" fill="#ffffff" stroke="#ccc"/>
    <line x1="80" y1="460" x2="110" y2="460" stroke="#d32f2f" stroke-width="3"/><text x="117" y="464">5V</text>
    <line x1="180" y1="460" x2="210" y2="460" stroke="#333" stroke-width="3"/><text x="217" y="464">GND</text>
    <line x1="280" y1="460" x2="310" y2="460" stroke="#f57f17" stroke-width="3"/><text x="317" y="464">Signal potentiomètre (A0)</text>
    <line x1="530" y1="460" x2="560" y2="460" stroke="#6a1b9a" stroke-width="3"/><text x="567" y="464">Commande PWM (Pin 9)</text>
  </g>
</svg>
