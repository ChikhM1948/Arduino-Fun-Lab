<svg viewBox="0 0 1050 980" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1050" height="980" fill="#fbf9f4"/>
  <text x="525" y="35" text-anchor="middle" font-size="24" font-weight="bold" fill="#2b2b2b">Montage sur Breadboard — Le Tableau de Bord Interactif</text>

  <!-- ================= BREADBOARD ================= -->
  <g id="breadboard">
    <rect x="150" y="70" width="750" height="330" rx="12" fill="#eeeeee" stroke="#bbb" stroke-width="2"/>

    <!-- top rails -->
    <line x1="170" y1="95" x2="880" y2="95" stroke="#e57373" stroke-width="2"/>
    <line x1="170" y1="115" x2="880" y2="115" stroke="#64b5f6" stroke-width="2"/>
    <text x="160" y="99" text-anchor="end" font-size="11" fill="#d32f2f">+</text>
    <text x="160" y="119" text-anchor="end" font-size="11" fill="#1565c0">−</text>
    <g fill="#999">
      <circle cx="190" cy="95" r="2.2"/><circle cx="210" cy="95" r="2.2"/><circle cx="230" cy="95" r="2.2"/><circle cx="250" cy="95" r="2.2"/><circle cx="270" cy="95" r="2.2"/><circle cx="290" cy="95" r="2.2"/><circle cx="310" cy="95" r="2.2"/><circle cx="330" cy="95" r="2.2"/><circle cx="350" cy="95" r="2.2"/><circle cx="370" cy="95" r="2.2"/><circle cx="390" cy="95" r="2.2"/><circle cx="410" cy="95" r="2.2"/><circle cx="430" cy="95" r="2.2"/><circle cx="450" cy="95" r="2.2"/><circle cx="470" cy="95" r="2.2"/><circle cx="490" cy="95" r="2.2"/><circle cx="510" cy="95" r="2.2"/><circle cx="530" cy="95" r="2.2"/><circle cx="550" cy="95" r="2.2"/><circle cx="570" cy="95" r="2.2"/><circle cx="590" cy="95" r="2.2"/><circle cx="610" cy="95" r="2.2"/><circle cx="630" cy="95" r="2.2"/><circle cx="650" cy="95" r="2.2"/><circle cx="670" cy="95" r="2.2"/><circle cx="690" cy="95" r="2.2"/><circle cx="710" cy="95" r="2.2"/><circle cx="730" cy="95" r="2.2"/><circle cx="750" cy="95" r="2.2"/><circle cx="770" cy="95" r="2.2"/><circle cx="790" cy="95" r="2.2"/><circle cx="810" cy="95" r="2.2"/><circle cx="830" cy="95" r="2.2"/><circle cx="850" cy="95" r="2.2"/>
      <circle cx="190" cy="115" r="2.2"/><circle cx="210" cy="115" r="2.2"/><circle cx="230" cy="115" r="2.2"/><circle cx="250" cy="115" r="2.2"/><circle cx="270" cy="115" r="2.2"/><circle cx="290" cy="115" r="2.2"/><circle cx="310" cy="115" r="2.2"/><circle cx="330" cy="115" r="2.2"/><circle cx="350" cy="115" r="2.2"/><circle cx="370" cy="115" r="2.2"/><circle cx="390" cy="115" r="2.2"/><circle cx="410" cy="115" r="2.2"/><circle cx="430" cy="115" r="2.2"/><circle cx="450" cy="115" r="2.2"/><circle cx="470" cy="115" r="2.2"/><circle cx="490" cy="115" r="2.2"/><circle cx="510" cy="115" r="2.2"/><circle cx="530" cy="115" r="2.2"/><circle cx="550" cy="115" r="2.2"/><circle cx="570" cy="115" r="2.2"/><circle cx="590" cy="115" r="2.2"/><circle cx="610" cy="115" r="2.2"/><circle cx="630" cy="115" r="2.2"/><circle cx="650" cy="115" r="2.2"/><circle cx="670" cy="115" r="2.2"/><circle cx="690" cy="115" r="2.2"/><circle cx="710" cy="115" r="2.2"/><circle cx="730" cy="115" r="2.2"/><circle cx="750" cy="115" r="2.2"/><circle cx="770" cy="115" r="2.2"/><circle cx="790" cy="115" r="2.2"/><circle cx="810" cy="115" r="2.2"/><circle cx="830" cy="115" r="2.2"/><circle cx="850" cy="115" r="2.2"/>
    </g>

    <!-- middle grid lines (visual only) -->
    <g stroke="#ccc" stroke-width="1">
      <line x1="170" y1="150" x2="880" y2="150"/>
      <line x1="170" y1="165" x2="880" y2="165"/>
      <line x1="170" y1="180" x2="880" y2="180"/>
      <line x1="170" y1="195" x2="880" y2="195"/>
      <line x1="170" y1="245" x2="880" y2="245"/>
      <line x1="170" y1="260" x2="880" y2="260"/>
      <line x1="170" y1="275" x2="880" y2="275"/>
      <line x1="170" y1="290" x2="880" y2="290"/>
      <line x1="170" y1="305" x2="880" y2="305"/>
    </g>
    <rect x="170" y="220" width="710" height="18" fill="#ddd"/>
    <text x="525" y="233" text-anchor="middle" font-size="10" fill="#888">canal central</text>

    <!-- bottom rails -->
    <line x1="170" y1="355" x2="880" y2="355" stroke="#e57373" stroke-width="2"/>
    <line x1="170" y1="375" x2="880" y2="375" stroke="#64b5f6" stroke-width="2"/>
    <text x="160" y="359" text-anchor="end" font-size="11" fill="#d32f2f">+</text>
    <text x="160" y="379" text-anchor="end" font-size="11" fill="#1565c0">−</text>

    <text x="525" y="415" text-anchor="middle" font-size="13" font-style="italic" fill="#777">Breadboard (vue de dessus)</text>
  </g>

  <!-- ================= COMPONENTS ON BREADBOARD ================= -->

  <!-- Potentiometer straddling gap -->
  <g id="potentiometer" transform="translate(280,170)">
    <rect x="0" y="0" width="70" height="70" rx="6" fill="#f9a825" stroke="#a86e00" stroke-width="2"/>
    <circle cx="35" cy="35" r="16" fill="#fff8e1" stroke="#a86e00" stroke-width="1.5"/>
    <line x1="35" y1="35" x2="49" y2="21" stroke="#a86e00" stroke-width="2"/>
    <text x="35" y="-8" text-anchor="middle" font-size="11" font-weight="bold" fill="#3b2c00">POT</text>
    <line x1="12" y1="70" x2="12" y2="85" stroke="#333" stroke-width="2"/>
    <line x1="35" y1="70" x2="35" y2="85" stroke="#333" stroke-width="2"/>
    <line x1="58" y1="70" x2="58" y2="85" stroke="#333" stroke-width="2"/>
    <text x="12" y="100" text-anchor="middle" font-size="9">GND</text>
    <text x="35" y="100" text-anchor="middle" font-size="9">A0</text>
    <text x="58" y="100" text-anchor="middle" font-size="9">5V</text>
  </g>

  <!-- LED straddling gap further right -->
  <g id="led" transform="translate(460,180)">
    <circle cx="20" cy="20" r="22" fill="#fff9c4" stroke="#f9a825" stroke-width="3"/>
    <text x="20" y="26" text-anchor="middle" font-size="15">💡</text>
    <text x="20" y="-8" text-anchor="middle" font-size="11" font-weight="bold" fill="#5c4300">LED</text>
    <line x1="10" y1="42" x2="10" y2="55" stroke="#333" stroke-width="2"/>
    <line x1="30" y1="42" x2="30" y2="55" stroke="#333" stroke-width="2"/>
    <text x="10" y="68" text-anchor="middle" font-size="9">+</text>
    <text x="30" y="68" text-anchor="middle" font-size="9">-</text>
  </g>

  <!-- Resistance 220 for LED -->
  <g id="resistor220" transform="translate(530,200)">
    <rect x="0" y="6" width="46" height="14" rx="3" fill="#d7ccc8" stroke="#5d4037" stroke-width="1.5"/>
    <path d="M6,13 L12,7 L18,19 L24,7 L30,19 L36,7 L40,13" stroke="#5d4037" stroke-width="1.5" fill="none"/>
    <text x="23" y="-2" text-anchor="middle" font-size="11" font-weight="bold" fill="#5d4037">R 220Ω</text>
    <line x1="0" y1="13" x2="-14" y2="13" stroke="#333" stroke-width="2"/>
    <line x1="46" y1="13" x2="60" y2="13" stroke="#333" stroke-width="2"/>
  </g>

  <!-- ================= ARDUINO ================= -->
  <g id="arduino" transform="translate(180,470)">
    <rect x="0" y="0" width="300" height="200" rx="10" fill="#1e88a8" stroke="#12546a" stroke-width="2"/>
    <text x="150" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">ARDUINO UNO</text>
    <rect x="10" y="80" width="40" height="55" fill="#c0c0c0" stroke="#888"/>
    <text x="30" y="112" text-anchor="middle" font-size="9" fill="#333">USB</text>
    <g font-size="12" fill="#fff">
      <text x="70" y="60">GND</text>
      <text x="115" y="60">5V</text>
      <text x="160" y="60">A0</text>
      <text x="70" y="180">D12</text>
      <text x="110" y="180">D11</text>
      <text x="150" y="180">D5</text>
      <text x="190" y="180">D4</text>
      <text x="230" y="180">D3</text>
      <text x="270" y="180">D2</text>
    </g>
    <g fill="#fff">
      <circle cx="75" cy="50" r="3"/>
      <circle cx="118" cy="50" r="3"/>
      <circle cx="165" cy="50" r="3"/>
      <circle cx="75" cy="170" r="3"/>
      <circle cx="118" cy="170" r="3"/>
      <circle cx="155" cy="170" r="3"/>
      <circle cx="195" cy="170" r="3"/>
      <circle cx="235" cy="170" r="3"/>
      <circle cx="275" cy="170" r="3"/>
    </g>
    <text x="230" y="90" font-size="12" fill="#fff">Pin 9 (~)</text>
    <circle cx="270" cy="80" r="3" fill="#fff"/>
  </g>

  <!-- ================= LCD ================= -->
  <g id="lcd" transform="translate(630,470)">
    <rect x="0" y="0" width="330" height="140" rx="10" fill="#2e7d32" stroke="#1b5e20" stroke-width="2"/>
    <text x="165" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">ÉCRAN LCD 16x2</text>
    <g font-size="11" fill="#fff">
      <text x="20" y="55">VSS</text><text x="60" y="55">VDD</text><text x="100" y="55">VO</text><text x="140" y="55">RS</text><text x="175" y="55">RW</text>
      <text x="210" y="55">E</text><text x="245" y="55">D4</text><text x="280" y="55">D5</text><text x="305" y="70">D6</text>
      <text x="20" y="90">D7</text>
    </g>
    <g fill="#fff">
      <circle cx="15" cy="45" r="3"/><circle cx="55" cy="45" r="3"/><circle cx="95" cy="45" r="3"/><circle cx="135" cy="45" r="3"/><circle cx="170" cy="45" r="3"/>
      <circle cx="205" cy="45" r="3"/><circle cx="240" cy="45" r="3"/><circle cx="275" cy="45" r="3"/><circle cx="310" cy="45" r="3"/>
      <circle cx="15" cy="80" r="3"/>
    </g>
  </g>

  <!-- ================= WIRES ================= -->
  <!-- Arduino GND -> top - rail -->
  <path d="M250,470 L250,440 L200,440 L200,115" fill="none" stroke="#333" stroke-width="2.5"/>
  <!-- Arduino 5V -> top + rail -->
  <path d="M295,470 L295,450 L220,450 L220,95" fill="none" stroke="#d32f2f" stroke-width="2.5"/>
  <!-- Arduino A0 -> pot center leg -->
  <path d="M340,470 L340,455 L315,455 L315,255" fill="none" stroke="#f57f17" stroke-width="2.5"/>

  <!-- Top rails to pot legs -->
  <path d="M292,95 L292,255" fill="none" stroke="#d32f2f" stroke-width="2"/>
  <path d="M270,115 L270,255" fill="none" stroke="#333" stroke-width="2"/>

  <!-- Arduino Pin9 -> LED anode -->
  <path d="M450,470 L450,460 L470,460 L470,250" fill="none" stroke="#6a1b9a" stroke-width="2.5"/>
  <text x="360" y="465" font-size="11" fill="#6a1b9a">Pin 9 → LED (+)</text>

  <!-- LED cathode -> resistor220 -->
  <path d="M490,250 L490,255 L545,255 L545,250" fill="none" stroke="#333" stroke-width="2"/>
  <!-- resistor220 -> bottom - rail -->
  <path d="M590,250 L590,355" fill="none" stroke="#333" stroke-width="2"/>

  <!-- Arduino digital pins -> LCD -->
  <path d="M250,670 L250,700 L735,700 L735,610" fill="none" stroke="#6a1b9a" stroke-width="2"/>
  <text x="480" y="695" font-size="11" fill="#6a1b9a">RS (D12 → LCD RS)</text>

  <path d="M288,670 L288,715 L810,715 L810,610" fill="none" stroke="#00838f" stroke-width="2"/>
  <text x="480" y="712" font-size="11" fill="#00838f">E (D11 → LCD E)</text>

  <path d="M330,670 L330,730 L845,730 L845,610" fill="none" stroke="#c62828" stroke-width="2"/>
  <text x="480" y="728" font-size="11" fill="#c62828">D4 (D5 → LCD D4)</text>

  <path d="M370,670 L370,745 L875,745 L875,610" fill="none" stroke="#2e7d32" stroke-width="2"/>
  <text x="480" y="742" font-size="11" fill="#2e7d32">D5 (D4 → LCD D5)</text>

  <path d="M410,670 L410,760 L905,760 L905,610" fill="none" stroke="#ef6c00" stroke-width="2"/>
  <text x="480" y="758" font-size="11" fill="#ef6c00">D6 (D3 → LCD D6)</text>

  <path d="M450,670 L450,775 L935,775 L935,610" fill="none" stroke="#4527a0" stroke-width="2"/>
  <text x="480" y="772" font-size="11" fill="#4527a0">D7 (D2 → LCD D7)</text>

  <!-- LCD VSS, VO, RW -> GND rail (dashed) -->
  <path d="M645,610 L645,580 L960,580 L960,115 L220,115" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="4,3"/>
  <path d="M725,610 L725,595 L975,595 L975,115" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="4,3"/>
  <path d="M765,610 L765,565 L945,565 L945,115" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="700" y="800" font-size="11" fill="#333" font-style="italic">VSS, VO et RW reliés au GND (VO = contraste maximal)</text>

  <!-- LCD VDD -> 5V rail (dashed) -->
  <path d="M685,610 L685,550 L990,550 L990,95 L220,95" fill="none" stroke="#d32f2f" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Legend -->
  <g font-size="12">
    <rect x="150" y="850" width="750" height="110" rx="8" fill="#ffffff" stroke="#ccc"/>
    <text x="525" y="872" text-anchor="middle" font-weight="bold">Légende</text>
    <line x1="170" y1="890" x2="200" y2="890" stroke="#d32f2f" stroke-width="3"/><text x="207" y="894">5V</text>
    <line x1="250" y1="890" x2="280" y2="890" stroke="#333" stroke-width="3"/><text x="287" y="894">GND</text>
    <line x1="350" y1="890" x2="380" y2="890" stroke="#f57f17" stroke-width="3"/><text x="387" y="894">Signal potentiomètre (A0)</text>
    <line x1="600" y1="890" x2="630" y2="890" stroke="#6a1b9a" stroke-width="3"/><text x="637" y="894">Données LCD / PWM LED</text>
    <text x="525" y="920" text-anchor="middle" font-size="11" fill="#888" font-style="italic">Le potentiomètre et la LED sont placés à cheval sur le canal central de la breadboard.</text>
  </g>
</svg>
