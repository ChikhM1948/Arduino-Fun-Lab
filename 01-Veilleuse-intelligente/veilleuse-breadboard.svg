<svg viewBox="0 0 900 780" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="780" fill="#fbf9f4"/>
  <text x="450" y="35" text-anchor="middle" font-size="24" font-weight="bold" fill="#2b2b2b">Montage sur Breadboard — La Veilleuse Intelligente</text>

  <!-- ================= BREADBOARD ================= -->
  <g id="breadboard">
    <rect x="120" y="70" width="660" height="290" rx="12" fill="#eeeeee" stroke="#bbb" stroke-width="2"/>

    <!-- top rails -->
    <line x1="140" y1="95" x2="760" y2="95" stroke="#e57373" stroke-width="2"/>
    <line x1="140" y1="115" x2="760" y2="115" stroke="#64b5f6" stroke-width="2"/>
    <text x="130" y="99" text-anchor="end" font-size="11" fill="#d32f2f">+</text>
    <text x="130" y="119" text-anchor="end" font-size="11" fill="#1565c0">−</text>
    <g fill="#999">
      <circle cx="160" cy="95" r="2.2"/><circle cx="180" cy="95" r="2.2"/><circle cx="200" cy="95" r="2.2"/><circle cx="220" cy="95" r="2.2"/><circle cx="240" cy="95" r="2.2"/><circle cx="260" cy="95" r="2.2"/><circle cx="280" cy="95" r="2.2"/><circle cx="300" cy="95" r="2.2"/><circle cx="320" cy="95" r="2.2"/><circle cx="340" cy="95" r="2.2"/><circle cx="360" cy="95" r="2.2"/><circle cx="380" cy="95" r="2.2"/><circle cx="400" cy="95" r="2.2"/><circle cx="420" cy="95" r="2.2"/><circle cx="440" cy="95" r="2.2"/><circle cx="460" cy="95" r="2.2"/><circle cx="480" cy="95" r="2.2"/><circle cx="500" cy="95" r="2.2"/><circle cx="520" cy="95" r="2.2"/><circle cx="540" cy="95" r="2.2"/><circle cx="560" cy="95" r="2.2"/><circle cx="580" cy="95" r="2.2"/><circle cx="600" cy="95" r="2.2"/><circle cx="620" cy="95" r="2.2"/><circle cx="640" cy="95" r="2.2"/><circle cx="660" cy="95" r="2.2"/><circle cx="680" cy="95" r="2.2"/><circle cx="700" cy="95" r="2.2"/><circle cx="720" cy="95" r="2.2"/><circle cx="740" cy="95" r="2.2"/>
      <circle cx="160" cy="115" r="2.2"/><circle cx="180" cy="115" r="2.2"/><circle cx="200" cy="115" r="2.2"/><circle cx="220" cy="115" r="2.2"/><circle cx="240" cy="115" r="2.2"/><circle cx="260" cy="115" r="2.2"/><circle cx="280" cy="115" r="2.2"/><circle cx="300" cy="115" r="2.2"/><circle cx="320" cy="115" r="2.2"/><circle cx="340" cy="115" r="2.2"/><circle cx="360" cy="115" r="2.2"/><circle cx="380" cy="115" r="2.2"/><circle cx="400" cy="115" r="2.2"/><circle cx="420" cy="115" r="2.2"/><circle cx="440" cy="115" r="2.2"/><circle cx="460" cy="115" r="2.2"/><circle cx="480" cy="115" r="2.2"/><circle cx="500" cy="115" r="2.2"/><circle cx="520" cy="115" r="2.2"/><circle cx="540" cy="115" r="2.2"/><circle cx="560" cy="115" r="2.2"/><circle cx="580" cy="115" r="2.2"/><circle cx="600" cy="115" r="2.2"/><circle cx="620" cy="115" r="2.2"/><circle cx="640" cy="115" r="2.2"/><circle cx="660" cy="115" r="2.2"/><circle cx="680" cy="115" r="2.2"/><circle cx="700" cy="115" r="2.2"/><circle cx="720" cy="115" r="2.2"/><circle cx="740" cy="115" r="2.2"/>
    </g>

    <!-- middle grid lines (visual only) -->
    <g stroke="#ccc" stroke-width="1">
      <line x1="140" y1="150" x2="760" y2="150"/>
      <line x1="140" y1="165" x2="760" y2="165"/>
      <line x1="140" y1="180" x2="760" y2="180"/>
      <line x1="140" y1="195" x2="760" y2="195"/>
      <line x1="140" y1="240" x2="760" y2="240"/>
      <line x1="140" y1="255" x2="760" y2="255"/>
      <line x1="140" y1="270" x2="760" y2="270"/>
      <line x1="140" y1="285" x2="760" y2="285"/>
    </g>
    <rect x="140" y="205" width="620" height="25" fill="#ddd"/>
    <text x="450" y="221" text-anchor="middle" font-size="10" fill="#888">canal central</text>

    <!-- bottom rails -->
    <line x1="140" y1="315" x2="760" y2="315" stroke="#e57373" stroke-width="2"/>
    <line x1="140" y1="335" x2="760" y2="335" stroke="#64b5f6" stroke-width="2"/>
    <text x="130" y="319" text-anchor="end" font-size="11" fill="#d32f2f">+</text>
    <text x="130" y="339" text-anchor="end" font-size="11" fill="#1565c0">−</text>

    <text x="450" y="375" text-anchor="middle" font-size="13" font-style="italic" fill="#777">Breadboard (vue de dessus)</text>
  </g>

  <!-- ================= COMPONENTS ON BREADBOARD ================= -->

  <!-- LDR straddling center gap -->
  <g id="ldr" transform="translate(260,185)">
    <circle cx="20" cy="15" r="18" fill="#fff59d" stroke="#a86e00" stroke-width="2"/>
    <path d="M6,8 L34,22 M6,22 L34,8 M2,15 L38,15" stroke="#7a5a00" stroke-width="1.5" fill="none"/>
    <text x="20" y="-6" text-anchor="middle" font-size="11" font-weight="bold" fill="#5c4300">LDR</text>
    <line x1="8" y1="33" x2="8" y2="45" stroke="#333" stroke-width="2"/>
    <line x1="32" y1="33" x2="32" y2="45" stroke="#333" stroke-width="2"/>
  </g>

  <!-- Resistance 10k, next to LDR, straddling gap -->
  <g id="resistor10k" transform="translate(330,195)">
    <rect x="0" y="6" width="46" height="14" rx="3" fill="#d7ccc8" stroke="#5d4037" stroke-width="1.5"/>
    <path d="M6,13 L12,7 L18,19 L24,7 L30,19 L36,7 L40,13" stroke="#5d4037" stroke-width="1.5" fill="none"/>
    <text x="23" y="-2" text-anchor="middle" font-size="11" font-weight="bold" fill="#5d4037">R 10kΩ</text>
    <line x1="0" y1="13" x2="-14" y2="13" stroke="#333" stroke-width="2"/>
    <line x1="46" y1="13" x2="60" y2="13" stroke="#333" stroke-width="2"/>
  </g>

  <!-- LED, straddling gap further right -->
  <g id="led" transform="translate(470,175)">
    <circle cx="20" cy="20" r="22" fill="#fff9c4" stroke="#f9a825" stroke-width="3"/>
    <text x="20" y="26" text-anchor="middle" font-size="15">💡</text>
    <text x="20" y="-8" text-anchor="middle" font-size="11" font-weight="bold" fill="#5c4300">LED</text>
    <line x1="10" y1="42" x2="10" y2="55" stroke="#333" stroke-width="2"/>
    <line x1="30" y1="42" x2="30" y2="55" stroke="#333" stroke-width="2"/>
    <text x="10" y="68" text-anchor="middle" font-size="9">+</text>
    <text x="30" y="68" text-anchor="middle" font-size="9">-</text>
  </g>

  <!-- Resistance 220 for LED, in series after cathode -->
  <g id="resistor220" transform="translate(540,195)">
    <rect x="0" y="6" width="46" height="14" rx="3" fill="#d7ccc8" stroke="#5d4037" stroke-width="1.5"/>
    <path d="M6,13 L12,7 L18,19 L24,7 L30,19 L36,7 L40,13" stroke="#5d4037" stroke-width="1.5" fill="none"/>
    <text x="23" y="-2" text-anchor="middle" font-size="11" font-weight="bold" fill="#5d4037">R 220-330Ω</text>
    <line x1="0" y1="13" x2="-14" y2="13" stroke="#333" stroke-width="2"/>
    <line x1="46" y1="13" x2="60" y2="13" stroke="#333" stroke-width="2"/>
  </g>

  <!-- ================= ARDUINO ================= -->
  <g id="arduino" transform="translate(150,420)">
    <rect x="0" y="0" width="280" height="190" rx="10" fill="#1e88a8" stroke="#12546a" stroke-width="2"/>
    <text x="140" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">ARDUINO UNO</text>
    <rect x="10" y="75" width="40" height="55" fill="#c0c0c0" stroke="#888"/>
    <text x="30" y="107" text-anchor="middle" font-size="9" fill="#333">USB</text>
    <g font-size="12" fill="#fff">
      <text x="90" y="60">5V</text>
      <text x="140" y="60">GND</text>
      <text x="195" y="60">A0</text>
      <text x="180" y="170">Pin 9 (~)</text>
    </g>
    <g fill="#fff">
      <circle cx="95" cy="50" r="3"/>
      <circle cx="148" cy="50" r="3"/>
      <circle cx="200" cy="50" r="3"/>
      <circle cx="200" cy="160" r="3"/>
    </g>
  </g>

  <!-- ================= WIRES ================= -->
  <!-- Arduino 5V -> top + rail -->
  <path d="M245,420 L245,400 L200,400 L200,95" fill="none" stroke="#d32f2f" stroke-width="2.5"/>
  <!-- Arduino GND -> top - rail -->
  <path d="M298,420 L298,410 L220,410 L220,115" fill="none" stroke="#333" stroke-width="2.5"/>
  <!-- Arduino A0 -> LDR/R junction row -->
  <path d="M350,420 L350,390 L305,390 L305,230" fill="none" stroke="#f57f17" stroke-width="2.5"/>

  <!-- Top + rail -> LDR top leg -->
  <path d="M268,95 L268,230" fill="none" stroke="#d32f2f" stroke-width="2"/>
  <!-- Bottom - rail -> resistor10k other leg -->
  <path d="M390,230 L390,315" fill="none" stroke="#333" stroke-width="2"/>

  <!-- Arduino Pin9 -> LED anode -->
  <path d="M430,420 L430,240 L480,240 L480,230" fill="none" stroke="#6a1b9a" stroke-width="2.5"/>
  <text x="380" y="255" font-size="11" fill="#6a1b9a">Pin 9 → LED (+)</text>

  <!-- LED cathode -> resistor220 -->
  <path d="M500,230 L500,240 L555,240 L555,230" fill="none" stroke="#333" stroke-width="2"/>
  <!-- resistor220 -> bottom - rail -->
  <path d="M600,230 L600,335" fill="none" stroke="#333" stroke-width="2"/>

  <!-- Legend -->
  <g font-size="12">
    <rect x="120" y="650" width="660" height="100" rx="8" fill="#ffffff" stroke="#ccc"/>
    <text x="450" y="672" text-anchor="middle" font-weight="bold">Légende</text>
    <line x1="140" y1="690" x2="170" y2="690" stroke="#d32f2f" stroke-width="3"/><text x="177" y="694">5V</text>
    <line x1="220" y1="690" x2="250" y2="690" stroke="#333" stroke-width="3"/><text x="257" y="694">GND</text>
    <line x1="320" y1="690" x2="350" y2="690" stroke="#f57f17" stroke-width="3"/><text x="357" y="694">Signal capteur (A0)</text>
    <line x1="530" y1="690" x2="560" y2="690" stroke="#6a1b9a" stroke-width="3"/><text x="567" y="694">Commande PWM (Pin 9)</text>
    <text x="450" y="720" text-anchor="middle" font-size="11" fill="#888" font-style="italic">La LDR et la LED sont placées à cheval sur le canal central de la breadboard.</text>
  </g>
</svg>
