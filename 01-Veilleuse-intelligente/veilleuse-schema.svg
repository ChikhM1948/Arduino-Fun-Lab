<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="560" fill="#fbf9f4"/>
  <text x="450" y="35" text-anchor="middle" font-size="24" font-weight="bold" fill="#2b2b2b">Schéma de câblage — La Veilleuse Intelligente</text>

  <!-- ARDUINO -->
  <rect x="60" y="90" width="220" height="380" rx="10" fill="#1e88a8" stroke="#12546a" stroke-width="2"/>
  <text x="170" y="120" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">ARDUINO UNO</text>

  <g font-size="14" fill="#fff">
    <text x="80" y="180">5V</text>
    <text x="80" y="230">GND</text>
    <text x="80" y="280">A0</text>
    <text x="80" y="380">Pin 9 (PWM ~)</text>
  </g>
  <g fill="#fff">
    <circle cx="275" cy="176" r="4"/>
    <circle cx="275" cy="226" r="4"/>
    <circle cx="275" cy="276" r="4"/>
    <circle cx="275" cy="376" r="4"/>
  </g>

  <!-- LDR + RESISTANCE 10k -->
  <g transform="translate(400,150)">
    <rect x="0" y="0" width="180" height="110" rx="8" fill="#8e24aa" stroke="#5c1877" stroke-width="2"/>
    <text x="90" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">LDR + R 10kΩ</text>
    <text x="90" y="45" text-anchor="middle" font-size="12" fill="#fff">(diviseur de tension)</text>
    <text x="90" y="65" text-anchor="middle" font-size="11" fill="#fff">LDR : 5V ↔ A0</text>
    <text x="90" y="82" text-anchor="middle" font-size="11" fill="#fff">R10k : A0 ↔ GND</text>
    <circle cx="90" cy="0" r="4" fill="#fff"/>
    <circle cx="0" cy="55" r="4" fill="#fff"/>
    <circle cx="90" cy="110" r="4" fill="#fff"/>
  </g>

  <!-- LED + RESISTANCE 220 -->
  <g transform="translate(650,300)">
    <circle cx="40" cy="10" r="24" fill="#fff9c4" stroke="#f9a825" stroke-width="3"/>
    <text x="40" y="16" text-anchor="middle" font-size="16">💡</text>
    <text x="40" y="-14" text-anchor="middle" font-size="13" font-weight="bold" fill="#5c4300">LED</text>
    <text x="10" y="45" font-size="10" fill="#333">+ (longue)</text>
    <text x="45" y="45" font-size="10" fill="#333">- (courte)</text>
    <line x1="15" y1="34" x2="15" y2="60" stroke="#333" stroke-width="2"/>
    <line x1="65" y1="34" x2="65" y2="60" stroke="#333" stroke-width="2"/>

    <!-- resistance 220 in series with cathode -->
    <rect x="50" y="60" width="14" height="46" rx="3" fill="#d7ccc8" stroke="#5d4037" stroke-width="1.5"/>
    <path d="M57,60 L50,68 L64,78 L50,88 L64,98 L57,106" stroke="#5d4037" stroke-width="1.5" fill="none"/>
    <text x="100" y="88" font-size="11" fill="#5d4037">R 220-330Ω</text>
  </g>

  <!-- CONNECTIONS -->
  <!-- Arduino 5V -> LDR top -->
  <path d="M275,176 L340,176 L340,150 L490,150" fill="none" stroke="#d32f2f" stroke-width="2.5"/>
  <!-- Arduino A0 -> LDR/R junction -->
  <path d="M275,276 L360,276 L360,205 L400,205" fill="none" stroke="#f57f17" stroke-width="2.5"/>
  <!-- LDR resistor bottom -> GND -->
  <path d="M490,260 L490,290 L320,290 L320,226 L275,226" fill="none" stroke="#333" stroke-width="2.5"/>

  <!-- Arduino Pin9 -> LED anode -->
  <path d="M275,376 L560,376 L560,344 L665,344" fill="none" stroke="#6a1b9a" stroke-width="2.5"/>
  <text x="420" y="370" font-size="11" fill="#6a1b9a">Pin 9 → LED (+)</text>

  <!-- LED cathode via resistor -> GND -->
  <path d="M714,406 L714,440 L300,440 L300,226 L275,226" fill="none" stroke="#333" stroke-width="2.5"/>

  <!-- Legend -->
  <g font-size="12">
    <rect x="60" y="500" width="780" height="40" rx="8" fill="#ffffff" stroke="#ccc"/>
    <line x1="80" y1="520" x2="110" y2="520" stroke="#d32f2f" stroke-width="3"/><text x="117" y="524">5V</text>
    <line x1="180" y1="520" x2="210" y2="520" stroke="#333" stroke-width="3"/><text x="217" y="524">GND</text>
    <line x1="280" y1="520" x2="310" y2="520" stroke="#f57f17" stroke-width="3"/><text x="317" y="524">Signal capteur (A0)</text>
    <line x1="480" y1="520" x2="510" y2="520" stroke="#6a1b9a" stroke-width="3"/><text x="517" y="524">Commande PWM (Pin 9)</text>
  </g>
</svg>
